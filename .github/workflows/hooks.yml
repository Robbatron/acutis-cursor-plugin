name: hooks

# The hooks are the acutis-plugin binary, built from the commit pinned in
# scripts/HOOK_SOURCE. acutis-plugin is private, so its own CI rebuilds that
# commit and compares these binaries (on every push and daily); this workflow
# checks them against scripts/SHA256SUMS and runs the shipped launcher the way
# Cursor starts hooks on each OS (PowerShell on Windows, a POSIX shell
# elsewhere).

on:
  push:
  pull_request:

jobs:
  binaries-match-recorded-checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Binaries match scripts/SHA256SUMS
        working-directory: scripts
        run: sha256sum -c SHA256SUMS

  launcher-runs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Shell gate denies a code-file write (Windows, through PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = '{"conversation_id":"ci","command":"Set-Content -Path gen.py -Value x","cwd":""}' | ./scripts/hook.cmd cursor before-shell
          Write-Output $out
          if ($out -notmatch '"permission":"deny"') { exit 1 }
      - name: Shell gate denies a code-file write (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          out=$(echo '{"conversation_id":"ci","command":"echo x > gen.py","cwd":""}' | sh -c './scripts/hook.cmd cursor before-shell')
          echo "$out"
          echo "$out" | grep -q '"permission":"deny"'
      - name: Session start answers with the context field (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = '{"conversation_id":"ci"}' | ./scripts/hook.cmd cursor session-start
          if ($out -notmatch 'additional_context') { exit 1 }
      - name: Session start answers with the context field (macOS, Linux)
        if: runner.os != 'Windows'
        run: echo '{"conversation_id":"ci"}' | sh -c './scripts/hook.cmd cursor session-start' | grep -q additional_context
